# Unbind default Ctrl + b
unbind C-b

# Set prefix to Ctrl + a
set-option -g prefix C-a
bind C-a send-prefix

# Better usability
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -g set-clipboard on
set -g window-status-current-style 'underscore'

# Easier switching between windows
bind -n C-Left  previous-window
bind -n C-Right next-window

# Make split directions more intuitive
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# don't rename windows automatically
set-option -g allow-rename on

# Reload tmux config easily
bind r source-file ~/.config/tmux/tmux.conf

# Status bar styling (optional, clean)
set -g status-position top
set -g status-bg black
set -g status-fg white

set -g status-left ''
set -g status-left-length 10

set -g status-right "#[fg=cyan]%H:%M"

setw -g window-status-current-style 'fg=black bg=cyan'
setw -g window-status-current-format ' #I #W  '

setw -g window-status-style 'fg=cyan bg=black'
setw -g window-status-format ' #[fg=white]#I #[fg=white]#W '
